aid: 99degreescustom
name: 99degrees Custom
description: >-
  99Degrees (99Degrees Custom, Inc.) is a Lawrence, Massachusetts contract apparel
  manufacturer founded in 2013 by Brenna Nan Schneider, operating out of the historic
  Everett Mills. It produces performance activewear, workwear, uniforms and
  technology-integrated apparel for global and growth-stage brands, and runs an R&D
  operation focused on Design for Manufacturing, rapid prototyping and applied research —
  including integrating sensors, electronics, robotics and hardware into textiles for
  wearable medical and industrial safety products. During the COVID-19 pandemic it pivoted
  its Lawrence floor to medical gowns and PPE. The company raised roughly $2.35M across
  four rounds, won the MIT Inclusive Innovation Competition top prize and MassChallenge's
  $100k Diamond Prize, and entered a manufacturing partnership with Reliable Source
  Industrial. 99Degrees is a physical-goods manufacturer, not a software company: no
  source, live or archived, shows it ever published a developer program, public API, SDK,
  webhook surface or machine-readable specification. Its canonical host
  99degreescustom.com lapsed and was re-registered by a domain broker on 2026-05-24; it
  now serves a "for sale" parking lander and is deliberately not wired as a Website
  pointer. This profile is retained as a historical record — there is no API surface to
  catalog.
