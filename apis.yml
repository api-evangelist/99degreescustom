x-domain-note: >-
  99degreescustom.com is registered to a domain broker (Domainsinthebag.com LLC, created
  2026-05-24, NS1.NAMEPROS-DNS.COM) and serves a NamePros "for sale" parking lander. The
  lander is a soft-200 catch-all: /llms.txt, /robots.txt and /news all return 200 with the
  same ~941-949 byte for-sale HTML, while every /.well-known/ path returns 404 and a
  negative-control path also returns 404 (no path echo). Wildcard DNS points api.,
  developer., docs., app. and every other subdomain at the same parking IP 3.233.30.191.
  None of it is a 99Degrees surface. See well-known/99degreescustom-well-known.yml.
